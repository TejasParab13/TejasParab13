<svg viewBox="0 0 1000 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Languages and Tools">
  <style>
    :root { 
      --bone: #000000; 
      --rule: #000000; 
      --muted: #000000; 
      --dim: #000000; 
      --accent: #000000; 
    }
    
    @media (prefers-color-scheme: dark) { 
      :root { 
        --bone: #FFFFFF; 
        --rule: #FFFFFF; 
        --muted: #FFFFFF; 
        --dim: #FFFFFF; 
        --accent: #FFFFFF; 
      } 
    }
    
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    
    .draw { 
      stroke-dasharray: 1000; 
      stroke-dashoffset: 1000; 
      animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; 
      will-change: stroke-dashoffset;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    
    .rise { 
      opacity: 0; 
      animation: rise 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; 
      will-change: transform, opacity;
    }
    @keyframes rise { 
      from { opacity: 0; transform: translate3d(0, 12px, 0); } 
      to { opacity: 1; transform: translate3d(0, 0, 0); } 
    }
    
    .fade { 
      opacity: 0; 
      animation: fade 0.7s ease forwards; 
      will-change: opacity;
    }
    @keyframes fade { to { opacity: 1; } }

    .reveal { 
      opacity: 0; 
      animation: slideReveal 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; 
      will-change: transform, opacity, clip-path;
    }
    @keyframes slideReveal { 
      from { opacity: 0; transform: translate3d(-10px, 0, 0); clip-path: inset(0 100% 0 0); } 
      to { opacity: 1; transform: translate3d(0, 0, 0); clip-path: inset(0 0 0 0); } 
    }
    
    .a1 { animation-delay: .2s; }
    .a2 { animation-delay: .5s; }
    .a3 { animation-delay: .9s; }
    .a4 { animation-delay: 1.2s; }
    .a5 { animation-delay: 1.4s; }
    .a6 { animation-delay: 1.7s; }
    .a7 { animation-delay: 2.0s; }

    @media (prefers-reduced-motion: reduce) {
      .draw, .rise, .fade, .reveal { animation: none; }
      .draw { stroke-dashoffset: 0; }
      .rise, .fade, .reveal { opacity: 1; transform: none; clip-path: none; }
    }
  </style>

  <!-- Header Info | STACK : LANGUAGES AND TOOLS -->
  <g class="rise a1">
    <text class="mono" fill="var(--muted)" x="48" y="44" font-size="11" letter-spacing="3.5"></text>
    <text class="mono" fill="var(--muted)" x="952" y="44" font-size="11" letter-spacing="3.5" text-anchor="end">TECHNICAL REPERTOIRE</text>
  </g>
  
  <!-- Top Divider -->
  <line class="draw a1" x1="410" y1="58" x2="952" y2="58" stroke="var(--rule)" stroke-width="1"/>

  <!-- Section Title -->
  <g class="rise a2">
    <text fill="var(--bone)" x="46" y="70" font-size="40" font-weight="600" letter-spacing="-1" font-family="Arial, sans-serif">Languages &amp; Tools</text>
  </g>

  <!-- Languages -->
  <g class="reveal a3">
    <text fill="var(--dim)" class="mono" x="48" y="150" font-size="20" letter-spacing="1">LANGUAGES</text>
  </g>
  
  <g class="reveal a4">
    <text fill="var(--muted)" class="mono" x="48" y="180" font-size="15">▸ Python</text>
    <text fill="var(--muted)" class="mono" x="280" y="180" font-size="15">▸ C</text>
    <text fill="var(--muted)" class="mono" x="520" y="180" font-size="15">▸ C++</text>
  </g>
  
  <g class="reveal a5">
    <text fill="var(--muted)" class="mono" x="48" y="200" font-size="15">▸ Dart</text>
    <text fill="var(--muted)" class="mono" x="280" y="200" font-size="15">▸ JavaScript</text>
  </g>

  <!-- Tools -->
  <g class="reveal a6">
    <text fill="var(--dim)" class="mono" x="48" y="250" font-size="20" letter-spacing="1">TOOLS</text>
  </g>
  
  <g class="reveal a7">
    <text fill="var(--muted)" class="mono" x="48" y="280" font-size="15">▸ VS Code</text>
    <text fill="var(--muted)" class="mono" x="280" y="280" font-size="15">▸ Visual Studio</text>
    <text fill="var(--muted)" class="mono" x="580" y="280" font-size="15">▸ Blender</text>
    <text fill="var(--muted)" class="mono" x="780" y="280" font-size="15">▸ Unity</text>
  </g>

  <!-- Bottom Divider -->
  <line class="draw a7" x1="48" y1="330" x2="952" y2="330" stroke="var(--rule)" stroke-width="1"/>

  <!-- Footer -->
  <g class="fade a7">
    <text fill="var(--muted)" class="mono" x="48" y="360" font-size="11.5" letter-spacing="3">CONSTANTLY LEARNING</text> 
    <text fill="var(--muted)" class="mono" x="952" y="360" font-size="11.5" letter-spacing="3" text-anchor="end">BUILDING · SHIPPING · ITERATING</text>
  </g>
</svg>